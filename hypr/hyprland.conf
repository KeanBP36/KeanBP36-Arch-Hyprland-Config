# =========================================================
# HYPRLAND
# =========================================================

env = PATH,/usr/local/bin:/usr/bin:/bin:/usr/local/sbin:/usr/sbin
package.path = package.path .. ";" .. vim.fn.expand("~/.config/hypr/split-monitor-workspaces/lua/?.lua")


# --------------------
# NVIDIA  GPU
# --------------------

# --- New ---
env = NVD_BACKEND,direct
env = LIBVA_DRIVER_NAME,nvidia
env = __GLX_VENDOR_LIBRARY_NAME,nvidia
env = GBM_BACKEND,nvidia-drm
env = WLR_NO_HARDWARE_CURSORS,1

# --- Legacy ---
# Use this if you experience issues with the modern settings above
# env = LIBVA_DRIVER_NAME,nvidia
# env = __GLX_VENDOR_LIBRARY_NAME,nvidia
# env = WLR_DRM_NO_ATOMIC,1

#---------------------
#AMD/INTEL  GPU
#---------------------
# --- AMD ---

# env = LIBVA_DRIVER_NAME,radeonsi

#--- Intel ---

# env = LIBVA_DRIVER_NAME,iHD


# --------------------
# AUTOSTART
# --------------------

exec-once = hypridle
exec-once = awww-daemon
exec-once = waybar -c ~/.config/waybar/config -s ~/.config/waybar/style.css
exec-once = /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1

exec-once = bash -c 'sleep 1 && awww img ~/Pictures/wallpaper.jpg'
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = wl-paste --type image --watch cliphist store

# --------------------
# VARIABLES
# --------------------
$mainMod = SUPER
$terminal = kitty
$fileManager = dolphin
$menu = rofi -show drun


# --------------------
# MONITOR
# --------------------

# HDMI-A-1 is now at 0x0 (Left side)
monitor = HDMI-A-1, 1920x1080@60, 0x0, 1

# DP-1 is now at 1920x0 (Right side)
monitor = DP-1, 1920x1080@100, 1920x0, 1

# Bindings to ensure workspaces stay on the correct screen
workspace = 1, monitor:DP-1
workspace = 2, monitor:HDMI-A-1

# Fallback
monitor = ,preferred,auto,1

# --------------------
# GENERAL
# --------------------
general {
    gaps_in = 6
    gaps_out = 12
    border_size = 2

    col.active_border = rgba(ffffffcc)
    col.inactive_border = rgba(33333388)

    layout = dwindle
}

# --------------------
# DECORATION
# --------------------
decoration {
    rounding = 10

    active_opacity = 0.92
    inactive_opacity = 0.85

    blur {
        enabled = true
        size = 3
        passes = 1
    }

    shadow {
        enabled = true
    }
}


# --------------------
# ANIMATIONS
# --------------------
animations {
    enabled = true

    bezier = smooth, 0.05, 0.9, 0.1, 1.05

    animation = windows, 1, 7, smooth
    animation = windowsOut, 1, 7, default, popin 80%
    animation = fade, 1, 6, default
    animation = workspaces, 1, 6, default
}

# --------------------
# INPUT
# --------------------
input {
    kb_layout = us
    follow_mouse = 1
    sensitivity = 0

    touchpad {
        natural_scroll = false
    }
}


# --------------------
# CURSOR
# --------------------
env = XCURSOR_THEME,Bibata-Modern-Ice
env = XCURSOR_SIZE,16
env = HYPRCURSOR_THEME,Bibata-Modern-Ice
env = HYPRCURSOR_SIZE,16

# --------------------
# MISC
# --------------------
misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
}

# --------------------
# KEYBINDS
# --------------------

# Volume / Brightness
bind = , XF86AudioRaiseVolume, exec, pamixer -i 5 && notify-send "Volume" "$(pamixer --get-volume)%"
bind = , XF86AudioLowerVolume, exec, pamixer -d 5 && notify-send "Volume" "$(pamixer --get-volume)%"
bind = , XF86MonBrightnessUp, exec, brightnessctl set +5% && notify-send "Brightness"
bind = , XF86MonBrightnessDown, exec, brightnessctl set 5%- && notify-send "Brightness"

# Core
bind = SUPER, L, exec, hyprlock
bind = $mainMod, Q, exec, $terminal
bind = $mainMod, C, killactive
bind = $mainMod, F, fullscreen
bind = $mainMod, V, togglefloating
bind = $mainMod, R, exec, $menu
bind = SUPER, SPACE, exec, rofi -show drun
bind = SUPER, E, exec, dolphin .
bind = SUPER SHIFT, E, exec, kitty -e ranger
bind = $mainMod, M, exec, hyprctl dispatch exit

# Focus movement
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

#power
bindl = , XF86PowerOff, exec, wlogout

# --------------------
# WORKSPACES
# --------------------

# Switch workspaces (1–10)
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Move windows to workspaces
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# Cycle workspaces (FIXED)
bind = SUPER, D, workspace, e+1
bind = SUPER, A, workspace, e-1

# Per-monitor cycling (optional but useful)
bind = SUPER CTRL, right, workspace, m+1
bind = SUPER CTRL, left, workspace, m-1

# Move window between monitors
bind = SUPER SHIFT, A, movewindow, mon:+1
bind = SUPER SHIFT, D, movewindow, mon:-1

# Mouse controls
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow


#---------------------
# SCREENSHOT SYSTEM
# Base key is S.
# 
# Modifiers:
# SHIFT = Save & Clipboard
# CTRL   = Edit (Swappy)
# ALT   = OCR
#
# Targets:
# (None) = Select Area
# A      = All Screens
# W      = Active Window
# C      = Current Screen
# 
#---------------------	

#DEFAULT

bind = SUPER, S, exec, grimblast copy area && notify-send "Screenshot" "Area"
bind = SUPER, Z, exec, grimblast copy screen && notify-send "Screenshot" "All Screens"
bind = SUPER, X, exec, grimblast copy active && notify-send "Screenshot" "Window"
bind = SUPER, O, exec, grimblast copy output && notify-send "Screenshot" "Current Screen"

#SAVE

bind = SUPER SHIFT, S, exec, grimblast --notify copysave area
bind = SUPER SHIFT, Z, exec, grimblast --notify copysave screen
bind = SUPER SHIFT, X, exec, grimblast --notify copysave active
bind = SUPER SHIFT, O, exec, grimblast --notify copysave output

#EDIT

bind = SUPER ALT, S, exec, /usr/bin/bash /home/kean/.local/bin/screenshot_edit.sh area
bind = SUPER ALT, Z, exec, /usr/bin/bash /home/kean/.local/bin/screenshot_edit.sh screen
bind = SUPER ALT, X, exec, /usr/bin/bash /home/kean/.local/bin/screenshot_edit.sh active
bind = SUPER ALT, O, exec, /usr/bin/bash /home/kean/.local/bin/screenshot_edit.sh output

#OCR

bind = SUPER CTRL, S, exec, /usr/bin/bash /home/kean/.local/bin/screenshot_ocr.sh area
bind = SUPER CTRL, Z, exec, /usr/bin/bash /home/kean/.local/bin/screenshot_ocr.sh screen
bind = SUPER CTRL, X, exec, /usr/bin/bash /home/kean/.local/bin/screenshot_ocr.sh active
bind = SUPER CTRL, O, exec, /usr/bin/bash /home/kean/.local/bin/screenshot_ocr.sh output


#EDIT & SAVE

bind = SUPER SHIFT ALT, S, exec, /usr/bin/bash /home/kean/.local/bin/screenshot_edit.sh area save
bind = SUPER SHIFT ALT, A, exec, /usr/bin/bash /home/kean/.local/bin/screenshot_edit.sh screen save
bind = SUPER SHIFT ALT, W, exec, /usr/bin/bash /home/kean/.local/bin/screenshot_edit.sh active save
bind = SUPER SHIFT ALT, C, exec, /usr/bin/bash /home/kean/.local/bin/screenshot_edit.sh output save

#OCR & SAVE

bind = SUPER SHIFT CTRL, S, exec, /usr/bin/bash /home/kean/.local/bin/screenshot_ocr.sh area save
bind = SUPER SHIFT CTRL, A, exec, /usr/bin/bash /home/kean/.local/bin/screenshot_ocr.sh screen save
bind = SUPER SHIFT CTRL, W, exec, /usr/bin/bash /home/kean/.local/bin/screenshot_ocr.sh active save
bind = SUPER SHIFT CTRL, C, exec, /usr/bin/bash /home/kean/.local/bin/screenshot_ocr.sh output save


# --------------------
# WINDOW RULES
# --------------------
#windowrulev2 = opacity 0.92 0.92,class:^(firefox)$
#windowrulev2 = opacity 0.90 0.90,class:^(kitty)$
#windowrulev2 = opacity 0.88 0.88,class:^(discord)$

#windowrulev2 = float,class:^(pavucontrol)$
#windowrulev2 = float,class:^(blueman-manager)$

decoration {
    active_opacity = 0.85
    inactive_opacity = 0.85
    fullscreen_opacity = 1.0
}

windowrule {
    name = swappy-float
    float = 1
    center = 1
    match:class = ^(swappy)$
}	

#-------------------
#dark mode
#-------------------

env = GTK_THEME,Adwaita:dark
env = GTK2_RC_FILES,/usr/share/themes/Adwaita-dark/gtk-2.0/gtkrc


# --- wlogout stuff ---
#layerrule = blur, logout_dialog
#layerrule = ignorezero, logout_dialog
